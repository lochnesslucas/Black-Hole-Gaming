<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Games Under $10 - Black Hole Gaming</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b16;
            color: white;
        }

        header {
            background: #111122;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #9b5cff;
        }

        header p {
            color: #aaa;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        nav a:hover {
            color: #9b5cff;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        h2 {
            margin-bottom: 25px;
        }

        .deals {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .deal {
            background: #131326;
            border: 1px solid #29294a;
            border-radius: 12px;
            padding: 20px;
        }

        .deal-image {
            width: 100%;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .deal h3 {
            margin-bottom: 12px;
        }

        .store {
            color: #aaa;
            margin-bottom: 15px;
        }

        .prices {
            margin-bottom: 15px;
        }

        .old-price {
            text-decoration: line-through;
            color: #777;
            margin-right: 10px;
        }

        .sale-price {
            font-size: 24px;
            font-weight: bold;
        }

        .discount {
            display: inline-block;
            background: #34205c;
            color: #c9a8ff;
            padding: 5px 8px;
            border-radius: 5px;
            margin-top: 8px;
        }

        .deal-button {
            display: block;
            text-align: center;
            background: #6c2cff;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .deal-button:hover {
            background: #824cff;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

    <header>

        <h1>Black Hole Gaming</h1>

        <p>Fall into the world of gaming.</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="deals.html">Game Deals</a>
            <a href="under5.html">Under $5</a>
            <a href="under10.html">Under $10</a>
        </nav>

    </header>

    <main>

        <h2>Games Under $10</h2>

        <div class="deals" id="dealsContainer">

            <p>Loading games...</p>

        </div>

    </main>

    <footer>

        Black Hole Gaming

    </footer>

<script>

const dealsContainer = document.querySelector('#dealsContainer');

const storeNames = {
    "1": "Steam",
    "2": "GamersGate",
    "3": "GreenManGaming",
    "7": "GOG",
    "8": "Origin",
    "11": "Humble Store",
    "13": "Ubisoft Store",
    "15": "Fanatical",
    "21": "WinGameStore",
    "23": "GameBillet",
    "24": "Voidu",
    "25": "Epic Games Store",
    "27": "GamesPlanet",
    "28": "2Game",
    "29": "Amazon",
    "30": "IndieGala",
    "31": "DreamGame",
    "33": "GameJolt",
    "34": "Gamesload",
    "35": "Playsum"
};

async function loadDeals() {

    dealsContainer.innerHTML =
        '<p>Loading games under $10...</p>';

    try {

        const response = await fetch(
            'https://www.cheapshark.com/api/1.0/deals?onSale=1&pageSize=50'
        );

        if (!response.ok) {
            throw new Error('Could not load deals');
        }

        const deals = await response.json();

        deals.sort(function(a, b) {
            return parseFloat(a.salePrice) -
                   parseFloat(b.salePrice);
        });

        dealsContainer.innerHTML = '';

        let foundGames = 0;

        deals.forEach(function(deal) {

            const salePrice = parseFloat(deal.salePrice);

            if (salePrice >= 5 && salePrice < 10) {

                const normalPrice =
                    parseFloat(deal.normalPrice);

                const discount =
                    parseFloat(deal.savings);

                const storeName =
                    storeNames[deal.storeID] ||
                    "Other Store";

                const dealElement =
                    document.createElement('div');

                dealElement.className = 'deal';

                dealElement.innerHTML = `
                    <img
                        src="${deal.thumb}"
                        alt="${deal.title}"
                        class="deal-image"
                    >

                    <h3>${deal.title}</h3>

                    <p class="store">
                        ${storeName}
                    </p>

                    <div class="prices">

                        <span class="old-price">
                            $${normalPrice.toFixed(2)}
                        </span>

                        <span class="sale-price">
                            $${salePrice.toFixed(2)}
                        </span>

                        <div class="discount">
                            ${Math.round(discount)}% OFF
                        </div>

                    </div>

                    <a
                        href="https://www.cheapshark.com/redirect?dealID=${deal.dealID}"
                        class="deal-button"
                        target="_blank"
                    >
                        View Deal
                    </a>
                `;

                dealsContainer.appendChild(dealElement);

                foundGames++;

            }

        });

        if (foundGames === 0) {

            dealsContainer.innerHTML =
                '<p>No games between $5 and $10 found right now.</p>';

        }

    } catch (error) {

        dealsContainer.innerHTML =
            '<p>Sorry, we could not load the games right now.</p>';

        console.error(error);

    }

}

loadDeals();

</script>

</body>

</html>
