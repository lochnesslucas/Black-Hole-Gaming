<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Game Finder - Black Hole Gaming</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #080812;
            color: white;
        }

        header {
            background: #111122;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #6c2cff;
        }

        header h1 {
            margin: 0 0 8px 0;
            color: #9b5cff;
        }

        header p {
            color: #aaa;
            margin: 0;
        }

        nav {
            margin-top: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
            font-weight: bold;
        }

        nav a:hover {
            color: #9b6cff;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 50px 20px;
        }

        h2 {
            text-align: center;
            margin-bottom: 15px;
        }

        .intro {
            text-align: center;
            color: #aaa;
            margin-bottom: 35px;
        }

        .finder {
            background: #131326;
            border: 1px solid #29294a;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 35px;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #39395a;
            background: #0b0b16;
            color: white;
            font-size: 16px;
        }

        .search-box:focus {
            outline: none;
            border-color: #6c2cff;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .game-card {
            background: #131326;
            border: 1px solid #29294a;
            border-radius: 12px;
            padding: 20px;
        }

        .game-card h3 {
            margin-bottom: 10px;
        }

        .game-card p {
            color: #aaa;
        }

        .game-button {
            display: block;
            text-align: center;
            background: #6c2cff;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .game-button:hover {
            background: #824cff;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #777;
        }

    </style>

</head>

<body>

    <header>

        <h1>🕳️ Black Hole Gaming</h1>

        <p>Fall into the world of gaming.</p>

        <nav>

            <a href="index.html">Home</a>

            <a href="deals.html">Game Deals</a>

            <a href="under5.html">Under $5</a>

            <a href="under10.html">Under $10</a>

            <a href="freegames.html">Free Games</a>

            <a href="gamefinder.html">Game Finder</a>

        </nav>

    </header>

    <main>

        <h2>Game Finder</h2>

        <p class="intro">
            Search for a game to find available deals.
        </p>

        <div class="finder">

            <input
                type="text"
                class="search-box"
                placeholder="Search for a game..."
            >

        </div>

        <div class="results" id="results">

            <p>Search for a game above.</p>

        </div>

    </main>

    <footer>

        Black Hole Gaming

    </footer>

<script>

const searchBox = document.querySelector('.search-box');
const results = document.querySelector('#results');

let searchTimer;

const storeNames = {
    "1": "Steam",
    "2": "GamersGate",
    "3": "GreenManGaming",
    "7": "GOG",
    "8": "Origin",
    "11": "Humble Store",
    "13": "Ubisoft Store",
    "15": "Fanatical",
    "21": "WinGameStore",
    "23": "GameBillet",
    "24": "Voidu",
    "25": "Epic Games Store",
    "27": "GamesPlanet",
    "28": "2Game",
    "29": "Amazon",
    "30": "IndieGala",
    "31": "DreamGame",
    "33": "GameJolt",
    "34": "Gamesload",
    "35": "Playsum"
};

async function searchGames() {

    const searchText =
        searchBox.value.trim();

    if (searchText === '') {

        results.innerHTML =
            '<p>Type a game name above to search.</p>';

        return;

    }

    results.innerHTML =
        '<p>Searching for games...</p>';

    try {

        const response = await fetch(
            'https://www.cheapshark.com/api/1.0/games?title=' +
            encodeURIComponent(searchText) +
            '&limit=20'
        );

        if (!response.ok) {
            throw new Error('Could not search for games');
        }

        const games = await response.json();

        if (!Array.isArray(games) || games.length === 0) {

            results.innerHTML =
                '<p>No games found.</p>';

            return;

        }

        const gameIDs =
            games
                .map(function(game) {
                    return game.gameID;
                })
                .join(',');

        const detailsResponse = await fetch(
            'https://www.cheapshark.com/api/1.0/games?ids=' +
            gameIDs
        );

        if (!detailsResponse.ok) {
            throw new Error('Could not load game deals');
        }

        const gameDetails =
            await detailsResponse.json();

        results.innerHTML = '';

        games.forEach(function(game) {

            const details =
                gameDetails[game.gameID];

            let storeName =
                'Store unavailable';

            let price =
                parseFloat(game.cheapest);

            let dealID =
                game.cheapestDealID;

            if (
                details &&
                details.deals &&
                details.deals.length > 0
            ) {

                const cheapestDeal =
                    details.deals.reduce(
                        function(lowest, deal) {

                            return parseFloat(deal.price) <
                                parseFloat(lowest.price)
                                ? deal
                                : lowest;

                        }
                    );

                storeName =
                    storeNames[cheapestDeal.storeID] ||
                    'Other Store';

                price =
                    parseFloat(cheapestDeal.price);

                dealID =
                    cheapestDeal.dealID;

            }

            const gameCard =
                document.createElement('div');

            gameCard.className =
                'game-card';

            gameCard.innerHTML = `

                <img
                    src="${game.thumb}"
                    alt="${game.external}"
                    style="width:100%; height:100px; object-fit:cover; border-radius:8px; margin-bottom:15px;"
                >

                <h3>${game.external}</h3>

                <p>
                    Cheapest current price:
                    <strong>
                        $${price.toFixed(2)}
                    </strong>
                </p>

                <p class="store">
                    ${storeName}
                </p>

                <a
                    href="https://www.cheapshark.com/redirect?dealID=${dealID}"
                    class="game-button"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    View Best Deal
                </a>

            `;

            results.appendChild(gameCard);

        });

    } catch (error) {

        results.innerHTML =
            '<p>Sorry, we could not search for games right now.</p>';

        console.error(error);

    }

}

searchBox.addEventListener(
    'input',
    function() {

        clearTimeout(searchTimer);

        searchTimer = setTimeout(
            searchGames,
            400
        );

    }
);

</script>
</body>

</html>
